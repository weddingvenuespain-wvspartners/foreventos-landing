<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOREVENTOS logo v5</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1A2419; --deep:#141E16; --cream:#F5F4EE; --muted:#6B756B; --line:rgba(26,36,25,.08); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#EFEEE7; color:var(--ink); font-family:Inter,sans-serif; padding:56px 48px 90px; }
  header h1{ font-family:Satoshi,sans-serif; font-weight:700; font-size:32px; letter-spacing:-.6px; margin:0 0 6px; }
  header p{ margin:0 0 40px; color:var(--muted); font-size:14px; }
  .concept{ background:#FBFAF6; border-radius:28px; padding:34px; margin-bottom:28px;
            box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 20px 50px rgba(20,30,22,.06); }
  .c-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:22px; }
  .c-head .n{ font-family:Satoshi,sans-serif; font-weight:700; font-size:13px; color:#8FAA94; letter-spacing:1px; }
  .c-head h2{ font-family:Satoshi,sans-serif; font-weight:700; font-size:22px; margin:0; letter-spacing:-.3px; }
  .c-head p{ margin:0; color:var(--muted); font-size:13.5px; }
  .grid{ display:grid; grid-template-columns:260px 1fr; gap:22px; }
  .hero-mark{ height:260px; border-radius:22px; background:var(--cream); display:grid; place-items:center;
              border:1px solid var(--line); }
  .hero-mark svg{ width:150px; height:150px; }
  .right{ min-width:0; display:grid; grid-template-rows:auto 1fr; gap:22px; }
  .lockups{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .lk{ height:118px; border-radius:22px; display:flex; align-items:center; justify-content:center; gap:16px; }
  .lk.l{ background:#fff; border:1px solid var(--line); }
  .lk.d{ background:var(--deep); color:var(--cream); }
  .lk svg.m{ width:52px; height:52px; }
  .wm{ font-family:Satoshi,sans-serif; font-weight:700; font-size:27px; letter-spacing:.16em; line-height:1; }
  .apps{ display:flex; gap:22px; align-items:center; }
  .app{ width:118px; height:118px; border-radius:27px; display:grid; place-items:center; position:relative; overflow:hidden;
        background:linear-gradient(160deg, #2E4433 0%, #16211A 55%, #0F1712 100%);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 18px 34px rgba(15,23,18,.28); }
  .app::after{ content:""; position:absolute; inset:0; border-radius:inherit;
               background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,255,255,.10), transparent 70%); }
  .app svg{ width:74px; height:74px; position:relative; z-index:1; }
  .app.lt{ background:linear-gradient(160deg, #FBFAF5 0%, #ECEAE0 100%); box-shadow:inset 0 1px 0 #fff, 0 18px 34px rgba(15,23,18,.14); }
  .favs{ display:flex; gap:14px; align-items:flex-end; }
  .favs span{ display:grid; place-items:center; background:var(--deep); }
  .f48{ width:48px; height:48px; border-radius:12px; } .f48 svg{ width:38px; height:38px; }
  .f32{ width:32px; height:32px; border-radius:8px; } .f32 svg{ width:26px; height:26px; }
  .f16{ width:16px; height:16px; border-radius:4px; } .f16 svg{ width:14px; height:14px; }
  .browser{ flex:1; min-width:0; height:118px; border-radius:18px; background:#fff; border:1px solid var(--line); overflow:hidden; }
  .browser .bar{ height:34px; background:#F1F0EA; display:flex; align-items:center; gap:10px; padding:0 12px; }
  .browser .dots i{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#D9D7CE; margin-right:4px; }
  .browser .tab{ display:flex; align-items:center; gap:7px; background:#fff; border-radius:8px 8px 0 0; padding:6px 12px; margin-top:6px;
                 font-size:11px; color:#333; }
  .browser .tab svg{ width:14px; height:14px; }
  .browser .nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; }
  .browser .nav .brand{ display:flex; align-items:center; gap:9px; }
  .browser .nav .brand svg:not(.o){ width:28px; height:28px; }
  .browser .nav .brand .wm{ font-size:15px; }
  .browser .nav .cta{ font-size:11px; font-weight:600; color:#F5F4EE; background:#1A2419; padding:8px 14px; border-radius:999px; }
  .card{ width:210px; height:118px; border-radius:10px; background:var(--deep); color:var(--cream); padding:16px 18px;
         display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 18px 34px rgba(15,23,18,.22); }
  .card .top{ display:flex; align-items:center; gap:8px; }
  .card .top svg:not(.o){ width:22px; height:22px; }
  .card .top .wm{ font-size:11px; }
  .card small{ font-size:9px; color:#B8C9B9; letter-spacing:.3px; line-height:1.5; }
  /* O en forma de arco dentro del wordmark (concepto 3) */
  .wm{ white-space:nowrap; }
  .browser .nav .cta{ white-space:nowrap; }
  .wm .o{ display:inline-block; width:.6em; height:.73em; vertical-align:-.01em; margin:0 .16em 0 0; }
</style>
</head>
<body>
<header>
  <h1>FOREVENTOS · logo v5 — el arco, bien construido</h1>
  <p>Geometría precisa, formas rellenas con grosores corregidos ópticamente y presentado en su uso real.</p>
</header>
<div id="board"></div>

<script>
  const C = {
    l:{ ink:'#1A2419', mid:'#4A6B52', sage:'#8FAA94', soft:'#B8C9B9', dot:'#3FA868', bg:'#F5F4EE' },
    d:{ ink:'#F5F4EE', mid:'#B8C9B9', sage:'#8FAA94', soft:'#4A6B52', dot:'#7BD89B', bg:'#141E16' }
  };
  const f = n => +n.toFixed(2);
  const pt = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [f(cx + r * Math.cos(a)), f(cy + r * Math.sin(a))]; };

  // 1 · Dovelas: arco de piedra en 7 dovelas; la clave, en verde y ligeramente destacada
  function dovelas(c){
    const cx = 60, cy = 62, n = 7, gap = 3.4, rIn = 23, rOut = 42;
    let s = '';
    for(let i = 0; i < n; i++){
      const key = i === 3;
      const a1 = 180 + i * 180 / n + gap / 2, a2 = 180 + (i + 1) * 180 / n - gap / 2;
      const ro = key ? rOut + 6 : rOut, ri = key ? rIn - 1 : rIn;
      const [x1,y1] = pt(cx,cy,ro,a1), [x2,y2] = pt(cx,cy,ro,a2), [x3,y3] = pt(cx,cy,ri,a2), [x4,y4] = pt(cx,cy,ri,a1);
      s += `<path d="M${x1} ${y1} A${ro} ${ro} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${ri} ${ri} 0 0 0 ${x4} ${y4} Z" fill="${key ? c.dot : c.ink}"/>`;
    }
    // Jambas: continúan el grosor del arco hasta la base
    s += `<rect x="${cx - rOut}" y="${cy + 3}" width="${rOut - rIn}" height="${108 - cy - 3}" rx="1.5" fill="${c.ink}"/>`;
    s += `<rect x="${cx + rIn}" y="${cy + 3}" width="${rOut - rIn}" height="${108 - cy - 3}" rx="1.5" fill="${c.ink}"/>`;
    return s;
  }
  // 2 · Umbral: arco macizo con vano interior y un sol/luz que asoma en el umbral
  function umbral(c){
    return `<path fill-rule="evenodd" fill="${c.ink}" d="M18 108 V54 A42 42 0 0 1 102 54 V108 Z M38 108 V56 A22 22 0 0 1 82 56 V108 Z"/>` +
           `<path fill="${c.dot}" d="M44 108 A16 16 0 0 1 76 108 Z"/>` +
           `<rect x="44" y="97" width="32" height="2.6" rx="1.3" fill="${c.bg}"/>`;
  }
  // 3 · Arco-O: ventana en arco, marco con grosor modulado (más fino arriba) y punto interior
  function arcoO(c){
    return `<path fill-rule="evenodd" fill="${c.ink}" d="M24 104 V56 A36 36 0 0 1 96 56 V104 A6 6 0 0 1 90 110 H30 A6 6 0 0 1 24 104 Z M38 96 V58 A22 22 0 0 1 82 58 V96 Z"/>` +
           `<circle cx="60" cy="74" r="8" fill="${c.dot}"/>`;
  }
  // 4 · Puerta entreabierta: arco macizo con la hoja abierta y la luz del evento saliendo
  function entreabierta(c){
    return `<path fill="${c.ink}" d="M24 108 V56 A36 36 0 0 1 96 56 V108 Z"/>` +
           `<path fill="${c.dot}" d="M60 30.3 A26 26 0 0 1 86 56 V108 H60 Z" opacity=".95"/>` +
           `<path fill="${c.soft}" d="M60 30.3 L74 36 V104 L60 108 Z"/>`;
  }
  // 5 · Arcos lineales: tres arcos finos concéntricos (estilo hotel/boutique), el interior en verde
  function lineales(c){
    const arc = (r, w, col) => `<path d="M${60 - r} 108 V60 A${r} ${r} 0 0 1 ${60 + r} 60 V108" fill="none" stroke="${col}" stroke-width="${w}"/>`;
    return arc(42, 8, c.ink) + arc(29, 8, c.ink) + `<path d="M44 108 V60 A16 16 0 0 1 76 60 V108 Z" fill="${c.dot}"/>`;
  }

  const CONCEPTS = [
    ['dovelas', 'Dovelas', 'Un arco de piedra de verdad: cada pieza sostiene a la otra y la clave verde lo une todo. Arquitectónico, sólido y premium.', dovelas],
    ['umbral', 'Umbral', 'Arco macizo con el vano abierto y una luz que asoma en el umbral: el evento que está por empezar.', umbral],
    ['arcoO', 'Arco-O', 'Ventana en arco con grosor modulado. Además hace de «O» dentro del propio nombre: FOREVENTOS.', arcoO, true],
    ['entreabierta', 'Puerta entreabierta', 'La hoja de la puerta se abre y deja salir la luz verde: bienvenida, acceso, experiencia.', entreabierta],
    ['lineales', 'Arcos lineales', 'Tres arcos concéntricos finos, estilo boutique hotel; el interior en verde marca el destino.', lineales]
  ];
  // La «O» del wordmark usa un viewBox recortado al contorno del arco para alinearse con la altura de mayúsculas
  const svg = (fn, mode, cls='') => `<svg ${cls ? `class="${cls}"` : ''} viewBox="${cls === 'o' ? '24 20 72 90' : '0 0 120 120'}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${fn(C[mode])}</svg>`;
  const wordmark = (fn, mode, arcO) => arcO
    ? `<span class="wm">F${svg(fn, mode, 'o')}REVENTOS</span>`
    : `<span class="wm">FOREVENTOS</span>`;

  document.getElementById('board').innerHTML = CONCEPTS.map(([k, t, d, fn, arcO], i) => `
    <section class="concept">
      <div class="c-head"><span class="n">0${i + 1}</span><h2>${t}</h2><p>${d}</p></div>
      <div class="grid">
        <div class="hero-mark">${svg(fn, 'l')}</div>
        <div class="right">
          <div class="lockups">
            <div class="lk l">${svg(fn, 'l', 'm')}${wordmark(fn, 'l', arcO)}</div>
            <div class="lk d">${svg(fn, 'd', 'm')}${wordmark(fn, 'd', arcO)}</div>
          </div>
          <div class="apps">
            <div class="app">${svg(fn, 'd')}</div>
            <div class="app lt">${svg(fn, 'l')}</div>
            <div class="favs"><span class="f48">${svg(fn, 'd')}</span><span class="f32">${svg(fn, 'd')}</span><span class="f16">${svg(fn, 'd')}</span></div>
            <div class="browser">
              <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="tab">${svg(fn, 'l')}FOREVENTOS</span></div>
              <div class="nav"><span class="brand">${svg(fn, 'l')}${wordmark(fn, 'l', arcO)}</span><span class="cta">Empieza gratis</span></div>
            </div>
            <div class="card"><div class="top">${svg(fn, 'd')}${wordmark(fn, 'd', arcO)}</div><small>La plataforma comercial para eventos<br/>foreventos.com</small></div>
          </div>
        </div>
      </div>
    </section>`).join('');
</script>
</body>
</html>
